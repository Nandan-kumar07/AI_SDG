<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Portal — Sign In & Registration | SDG Antigravity</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <!-- Top Simple Navigation -->
  <nav class="site-navbar py-2 px-3 px-md-4">
    <div class="d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <div class="brand-logo-icon">
          <i class="fa-solid fa-earth-americas"></i>
        </div>
        <span class="brand-logo-text">SDG <span class="text-success">Antigravity</span></span>
      </a>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-sm btn-outline-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
        </a>
        <a href="faculty-login.html" class="btn btn-sm btn-link text-decoration-none text-dark">Faculty Login</a>
      </div>
    </div>
  </nav>

  <!-- Student Auth Card -->
  <main class="auth-wrapper">
    <div class="card-glass auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-logo-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem;">
          <i class="fa-solid fa-user-graduate"></i>
        </div>
        <h3 class="fw-bold mb-1">Student Portal</h3>
        <p class="text-muted small">Sign in or register to receive tailored AI SDG tasks & Deep Learning milestones</p>
      </div>

      <!-- Auth Switch Tabs -->
      <div class="auth-nav-pills">
        <button id="student-tab-login" class="active">Student Sign In</button>
        <button id="student-tab-signup">New Student Registration</button>
      </div>

      <!-- Student Login Form -->
      <div id="student-form-login-box">
        <form id="form-student-login">
          <div class="mb-3">
            <label class="form-label small fw-bold">USN or University Email</label>
            <input type="email" id="student-signup-email" class="form-control form-control-sm" placeholder="akash@campus.edu" />
              <span class="input-group-text bg-light"><i class="fa-solid fa-id-card text-muted"></i></span>
              <input type="text" id="student-login-usn" class="form-control" placeholder="e.g. 1RV22CS045" value="1RV22CS045" required />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">College Join Code</label>
            <input type="text" id="student-login-college-code" class="form-control" placeholder="e.g. CAMPUS001" value="CAMPUS001" required />
          </div>
          <div class="mb-3 d-none">
            <label class="form-label small fw-bold">Class Join Code</label>
            <input type="text" id="student-login-class-code" class="form-control" placeholder="Optional class code" value="" />
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label small fw-bold mb-0">Password</label>
              <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
            </div>
            <div class="input-group mt-1">
              <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" id="student-login-pass" class="form-control" placeholder="••••••••" value="password123" required />
            </div>
          </div>

          <!-- Captcha Box -->
          <div class="mb-3">
            <label class="form-label small fw-bold">Security Captcha</label>
            <div class="captcha-container mb-2">
              <span class="captcha-badge" id="captcha-display-student">7X9K2</span>
              <button type="button" class="btn btn-sm btn-link text-decoration-none" id="btn-refresh-captcha-student" title="Refresh Captcha">
                <i class="fa-solid fa-rotate"></i>
              </button>
            </div>
            <input type="text" id="student-login-captcha" class="form-control form-control-sm" placeholder="Enter characters shown above" required />
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In to Student Dashboard
          </button>
        </form>
      </div>

      <!-- Student Sign Up Form (All 9 Requested Fields) -->
      <div id="student-form-signup-box" class="d-none">
        <form id="form-student-signup">
          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Student Name</label>
              <input type="text" id="student-signup-name" class="form-control form-control-sm" placeholder="e.g. Akash Sharma" required />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">University Serial No (USN)</label>
              <input type="text" id="student-signup-usn" class="form-control form-control-sm" placeholder="e.g. 1RV22CS045" required />
            </div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Department (DEPT)</label>
              <select id="student-signup-dept" class="form-select form-select-sm" required>
                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                <option value="Artificial Intelligence & ML">Artificial Intelligence & ML</option>
                <option value="Electrical & Electronics Eng">Electrical & Electronics Eng</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Information Science & Eng">Information Science & Eng</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Phone Number</label>
              <input type="tel" id="student-signup-phone" class="form-control form-control-sm" placeholder="+91 98765 43210" required />
            </div>
          </div>

          <div class="mb-2 d-none">
            <label class="form-label small fw-bold">Institutional Email</label>
            <input type="email" id="student-signup-email" class="form-control form-control-sm" placeholder="akash@campus.edu" />
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">College Join Code</label>
            <input type="text" id="student-signup-college-code" class="form-control form-control-sm" placeholder="Code provided by your faculty" value="CAMPUS001" required />
          </div>
          <div class="mb-2 d-none">
            <label class="form-label small fw-bold">Class Join Code</label>
            <input type="text" id="student-signup-class-code" class="form-control form-control-sm" placeholder="Optional class code" value="" />
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Skills</label>
              <input type="text" id="student-signup-skills" class="form-control form-control-sm" placeholder="e.g. Python, PyTorch, Deep Learning, IoT" />
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Interests (SDG Focus)</label>
              <input type="text" id="student-signup-interests" class="form-control form-control-sm" placeholder="e.g. Responsible Consumption (SDG 12), Clean Energy" />
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Password</label>
            <input type="password" id="student-signup-pass" class="form-control form-control-sm" placeholder="Minimum 6 characters" required />
          </div>

          <!-- Captcha -->
          <div class="mb-3">
            <label class="form-label small fw-bold">Security Captcha</label>
            <div class="captcha-container mb-2">
              <span class="captcha-badge" id="captcha-display-student-signup">8P3W9</span>
            </div>
            <input type="text" id="student-signup-captcha" class="form-control form-control-sm" placeholder="Enter captcha code" required />
          </div>

          <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
            <i class="fa-solid fa-user-plus me-2"></i> Register & Auto-Assign AI Task
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/state.js"></script>
  <script src="../js/ai-engine.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let currentCaptcha = "7X9K2";
      let currentSignupCaptcha = "8P3W9";

      function refreshCaptcha() {
        const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
        let code = "";
        for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        currentCaptcha = code;
        document.getElementById("captcha-display-student").textContent = code;
      }

      document.getElementById("btn-refresh-captcha-student").addEventListener("click", refreshCaptcha);
      refreshCaptcha();

      // Tab Toggles
      const loginTab = document.getElementById("student-tab-login");
      const signupTab = document.getElementById("student-tab-signup");
      const loginBox = document.getElementById("student-form-login-box");
      const signupBox = document.getElementById("student-form-signup-box");

      loginTab.addEventListener("click", () => {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
        loginBox.classList.remove("d-none");
        signupBox.classList.add("d-none");
      });

      signupTab.addEventListener("click", () => {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");
        signupBox.classList.remove("d-none");
        loginBox.classList.add("d-none");
      });

      // Login Form Submit
      document.getElementById("form-student-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const usnOrEmail = document.getElementById("student-login-usn").value.trim();
        const pass = document.getElementById("student-login-pass").value;
        const collegeCode = document.getElementById("student-login-college-code").value.trim();
        const classCode = document.getElementById("student-login-class-code").value.trim();
        const captcha = document.getElementById("student-login-captcha").value.trim().toUpperCase();

        if (captcha !== currentCaptcha) {
          alert("Invalid Captcha code! Please try again.");
          refreshCaptcha();
          return;
        }

        const result = await window.appState.loginStudent(usnOrEmail, pass, collegeCode, classCode);
        if (result.success) window.location.href = "student-dashboard.html";
        else alert("Login failed. Please check your credentials.");
      });

      // Signup Form Submit
      document.getElementById("form-student-signup").addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = document.getElementById("student-signup-name").value.trim();
        const usn = document.getElementById("student-signup-usn").value.trim();
        const dept = document.getElementById("student-signup-dept").value;
        const skills = document.getElementById("student-signup-skills").value.trim();
        const interests = document.getElementById("student-signup-interests").value.trim();
        const phone = document.getElementById("student-signup-phone").value.trim();
        const email = document.getElementById("student-signup-email").value.trim();
        const pass = document.getElementById("student-signup-pass").value;
        const collegeCode = document.getElementById("student-signup-college-code").value.trim();
        const classCode = document.getElementById("student-signup-class-code").value.trim();

        const result = await window.appState.signupStudent({
          name, usn, department: dept, skills, interests, phone, email, password: pass
        }, collegeCode, classCode);

        if (result.success) {
          alert("Registration successful! Redirecting to your dashboard...");
          window.location.href = "student-dashboard.html";
        } else alert("Signup failed. Please try again.");
      });
    });
  </script>
</body>
</html>
