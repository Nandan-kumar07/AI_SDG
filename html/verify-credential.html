<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify SDG Credential — SDG Connect</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="card-glass p-5 max-w-600 mx-auto text-center">
      <h2 class="fw-bold mb-3">SDG Credential Verification</h2>
      <p class="text-muted">Enter the verification code from an SDG Connect certificate.</p>
      <form id="verify-form" class="d-flex gap-2 justify-content-center mb-4">
        <input id="verify-code" class="form-control" style="max-width:280px" placeholder="Verification code" required />
        <button class="btn btn-primary" type="submit">Verify</button>
      </form>
      <div id="verify-result"></div>
      <a href="index.html" class="btn btn-link mt-3">Back to Home</a>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const prefill = params.get("code") || window.location.pathname.split("/").pop();
    if (prefill && prefill !== "verify-credential.html") document.getElementById("verify-code").value = prefill;

    document.getElementById("verify-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const code = document.getElementById("verify-code").value.trim();
      const box = document.getElementById("verify-result");
      box.innerHTML = '<div class="spinner-border text-primary"></div>';
      try {
        const res = await fetch(`/api/credentials/verify/${encodeURIComponent(code)}`);
        const data = await res.json();
        if (!res.ok || !data.valid) {
          box.innerHTML = '<div class="alert alert-danger">Credential not found or invalid.</div>';
          return;
        }
        box.innerHTML = `<div class="alert alert-success text-start">
          <strong>Valid credential</strong><br/>
          Student: ${data.studentName}<br/>
          Department: ${data.department}<br/>
          Title: ${data.title}<br/>
          SDGs: ${(data.sdgGoals || []).map(g => `SDG ${g}`).join(", ")}<br/>
          Issued: ${new Date(data.issuedAt).toLocaleString()}
        </div>`;
      } catch (_err) {
        box.innerHTML = '<div class="alert alert-danger">Verification service unavailable.</div>';
      }
    });
  </script>
</body>
</html>
