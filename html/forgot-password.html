<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | SDG Antigravity</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <nav class="site-navbar py-2 px-3 px-md-4">
    <div class="d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <div class="brand-logo-icon">
          <i class="fa-solid fa-earth-americas"></i>
        </div>
        <span class="brand-logo-text">SDG <span class="text-success">Antigravity</span></span>
      </a>
      <a href="student-login.html" class="btn btn-sm btn-outline-secondary">
        <i class="fa-solid fa-arrow-left me-1"></i> Back to Login
      </a>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="card-glass auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-logo-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem; background: linear-gradient(135deg, #f59e0b, #ef4444);">
          <i class="fa-solid fa-key"></i>
        </div>
        <h3 class="fw-bold mb-1">Reset Password</h3>
        <p class="text-muted small">Enter your email and confirm your new password to restore access</p>
      </div>

      <form id="form-forgot-password">
        <div class="mb-3">
          <label class="form-label small fw-bold">Registered University Email</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
            <input type="email" id="forgot-email" class="form-control" placeholder="e.g. akash.cs22@campus.edu" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
            <input type="password" id="forgot-new-pass" class="form-control" placeholder="Enter new password (min 6 chars)" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-lock-open text-muted"></i></span>
            <input type="password" id="forgot-confirm-pass" class="form-control" placeholder="Re-enter new password" required />
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold">Security Captcha</label>
          <div class="captcha-container mb-2">
            <span class="captcha-badge" id="captcha-display-forgot">9L2X7</span>
            <button type="button" class="btn btn-sm btn-link text-decoration-none" id="btn-refresh-captcha-forgot">
              <i class="fa-solid fa-rotate"></i>
            </button>
          </div>
          <input type="text" id="forgot-captcha" class="form-control form-control-sm" placeholder="Enter captcha code" required />
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
          <i class="fa-solid fa-shield-check me-2"></i> Reset & Confirm New Password
        </button>

        <div class="text-center">
          <a href="student-login.html" class="small text-muted text-decoration-none">
            <i class="fa-solid fa-arrow-left me-1"></i> Return to Student Login
          </a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/state.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let currentCaptcha = "9L2X7";

      function refreshCaptcha() {
        const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
        let code = "";
        for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        currentCaptcha = code;
        document.getElementById("captcha-display-forgot").textContent = code;
      }

      document.getElementById("btn-refresh-captcha-forgot").addEventListener("click", refreshCaptcha);
      refreshCaptcha();

      document.getElementById("form-forgot-password").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("forgot-email").value.trim();
        const newPass = document.getElementById("forgot-new-pass").value;
        const confirmPass = document.getElementById("forgot-confirm-pass").value;
        const captcha = document.getElementById("forgot-captcha").value.trim().toUpperCase();

        if (captcha !== currentCaptcha) {
          alert("Invalid Captcha code! Please try again.");
          refreshCaptcha();
          return;
        }

        if (newPass.length < 6) {
          alert("Password must be at least 6 characters long.");
          return;
        }

        if (newPass !== confirmPass) {
          alert("Passwords do not match! Please check your confirmation password.");
          return;
        }

        alert(`✅ Password successfully reset for ${email}! Please sign in with your new password.`);
        window.location.href = "student-login.html";
      });
    });
  </script>
</body>
</html>
