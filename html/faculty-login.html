<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Portal — Sign In & Registration | SDG Antigravity</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <nav class="site-navbar py-2 px-3 px-md-4">
    <div class="d-flex justify-content-between align-items-center">
      <a href="index.html" class="d-flex align-items-center gap-2 text-decoration-none">
        <div class="brand-logo-icon" style="background: linear-gradient(135deg, #0284c7, #6366f1);">
          <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <span class="brand-logo-text">SDG <span class="text-primary">Antigravity</span></span>
      </a>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-sm btn-outline-secondary">
          <i class="fa-solid fa-arrow-left me-1"></i> Back to Home
        </a>
        <a href="student-login.html" class="btn btn-sm btn-link text-decoration-none text-dark">Student Login</a>
      </div>
    </div>
  </nav>

  <main class="auth-wrapper">
    <div class="card-glass auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-logo-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.4rem; background: linear-gradient(135deg, #0284c7, #6366f1);">
          <i class="fa-solid fa-chalkboard-user"></i>
        </div>
        <h3 class="fw-bold mb-1">Faculty & Admin Portal</h3>
        <p class="text-muted small">Monitor student progress, review submissions & create SDG activities</p>
      </div>

      <div class="auth-nav-pills">
        <button id="faculty-tab-login" class="active">Faculty Sign In</button>
        <button id="faculty-tab-signup">Faculty Registration</button>
      </div>

      <!-- Faculty Login Form -->
      <div id="faculty-form-login-box">
        <form id="form-faculty-login">
          <div class="mb-3">
            <label class="form-label small fw-bold">Faculty Institutional Email</label>
            <div class="input-group">
              <span class="input-group-text bg-light"><i class="fa-solid fa-envelope text-muted"></i></span>
              <input type="email" id="faculty-login-email" class="form-control" placeholder="sarah.johnson@campus.edu" value="sarah.johnson@campus.edu" required />
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center">
              <label class="form-label small fw-bold mb-0">Password</label>
              <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
            </div>
            <div class="input-group mt-1">
              <span class="input-group-text bg-light"><i class="fa-solid fa-lock text-muted"></i></span>
              <input type="password" id="faculty-login-pass" class="form-control" placeholder="••••••••" value="password123" required />
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Security Captcha</label>
            <div class="captcha-container mb-2">
              <span class="captcha-badge" id="captcha-display-faculty">5M9R4</span>
              <button type="button" class="btn btn-sm btn-link text-decoration-none" id="btn-refresh-captcha-faculty">
                <i class="fa-solid fa-rotate"></i>
              </button>
            </div>
            <input type="text" id="faculty-login-captcha" class="form-control form-control-sm" placeholder="Enter characters shown above" required />
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Access Faculty Dashboard
          </button>
        </form>
      </div>

      <!-- Faculty Sign Up Form -->
      <div id="faculty-form-signup-box" class="d-none">
        <form id="form-faculty-signup">
          <div class="mb-2">
            <label class="form-label small fw-bold">Faculty Name</label>
            <input type="text" id="faculty-signup-name" class="form-control form-control-sm" placeholder="Dr. Deepa Nair" required />
          </div>

          <div class="row g-2 mb-2">
            <div class="col-md-6">
              <label class="form-label small fw-bold">Department (DEPT)</label>
              <select id="faculty-signup-dept" class="form-select form-select-sm" required>
                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                <option value="Artificial Intelligence & ML">Artificial Intelligence & ML</option>
                <option value="Environmental Engineering">Environmental Engineering</option>
                <option value="Electrical & Electronics Eng">Electrical & Electronics Eng</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Phone Number</label>
              <input type="tel" id="faculty-signup-phone" class="form-control form-control-sm" placeholder="+91 98800 12345" required />
            </div>
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Institutional Email</label>
            <input type="email" id="faculty-signup-email" class="form-control form-control-sm" placeholder="faculty@campus.edu" required />
          </div>

          <div class="mb-2">
            <label class="form-label small fw-bold">Password</label>
            <input type="password" id="faculty-signup-pass" class="form-control form-control-sm" placeholder="••••••••" required />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-bold">Security Captcha</label>
            <div class="captcha-container mb-2">
              <span class="captcha-badge" id="captcha-display-faculty-signup">4T8B1</span>
            </div>
            <input type="text" id="faculty-signup-captcha" class="form-control form-control-sm" placeholder="Enter captcha code" required />
          </div>

          <button type="submit" class="btn btn-info w-100 py-2 fw-bold text-white">
            <i class="fa-solid fa-user-tie me-2"></i> Register Faculty Account
          </button>
        </form>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/state.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let currentCaptcha = "5M9R4";

      function refreshCaptcha() {
        const chars = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";
        let code = "";
        for (let i = 0; i < 5; i++) code += chars.charAt(Math.floor(Math.random() * chars.length));
        currentCaptcha = code;
        document.getElementById("captcha-display-faculty").textContent = code;
      }

      document.getElementById("btn-refresh-captcha-faculty").addEventListener("click", refreshCaptcha);
      refreshCaptcha();

      const loginTab = document.getElementById("faculty-tab-login");
      const signupTab = document.getElementById("faculty-tab-signup");
      const loginBox = document.getElementById("faculty-form-login-box");
      const signupBox = document.getElementById("faculty-form-signup-box");

      loginTab.addEventListener("click", () => {
        loginTab.classList.add("active");
        signupTab.classList.remove("active");
        loginBox.classList.remove("d-none");
        signupBox.classList.add("d-none");
      });

      signupTab.addEventListener("click", () => {
        signupTab.classList.add("active");
        loginTab.classList.remove("active");
        signupBox.classList.remove("d-none");
        loginBox.classList.add("d-none");
      });

      document.getElementById("form-faculty-login").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("faculty-login-email").value.trim();
        const pass = document.getElementById("faculty-login-pass").value;
        const captcha = document.getElementById("faculty-login-captcha").value.trim().toUpperCase();

        if (captcha !== currentCaptcha) {
          alert("Invalid Captcha code! Please try again.");
          refreshCaptcha();
          return;
        }

        window.appState.loginFaculty(email, pass);
        window.location.href = "faculty-dashboard.html";
      });

      document.getElementById("form-faculty-signup").addEventListener("submit", (e) => {
        e.preventDefault();
        const name = document.getElementById("faculty-signup-name").value.trim();
        const dept = document.getElementById("faculty-signup-dept").value;
        const phone = document.getElementById("faculty-signup-phone").value.trim();
        const email = document.getElementById("faculty-signup-email").value.trim();
        const pass = document.getElementById("faculty-signup-pass").value;

        window.appState.signupFaculty({
          name, department: dept, phone, email, password: pass
        });

        alert("Registration successful! Redirecting to faculty portal...");
        window.location.href = "faculty-dashboard.html";
      });
    });
  </script>
</body>
</html>
